name: Build Debug APK

on:
  push:
    branches: [ "claude/zealous-lamport-1QU2I", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blue2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build wear debug APK
        run: ./gradlew :wear:assembleDebug --no-daemon

      - name: Upload wear APK
        uses: actions/upload-artifact@v4
        with:
          name: Blue2-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 7
